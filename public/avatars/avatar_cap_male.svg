<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#d96c60"/>

  <!-- Neck & Shoulders -->
  <!-- White open collared shirt -->
  <path d="M 55,200 L 65,160 L 78,145 L 122,145 L 135,160 L 145,200 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Black inner t-shirt -->
  <path d="M 80,145 L 85,190 C 95,195 105,195 115,190 L 120,145 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="4"/>
  
  <!-- Shirt Collar flaps -->
  <path d="M 78,145 L 60,178 L 86,170 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 122,145 L 140,178 L 114,170 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 60,178 L 52,200" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>
  <path d="M 140,178 L 148,200" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 80,115 L 80,148 C 90,154 110,154 120,148 L 120,115 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ears -->
  <path d="M 56,88 C 44,88 44,115 56,115" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 52,98 C 50,102 54,106 56,104" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <path d="M 144,88 C 156,88 156,115 144,115" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 148,98 C 150,102 146,106 144,104" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <!-- Face Contour -->
  <path d="M 56,85 C 56,128 72,143 100,143 C 128,143 144,128 144,85 C 144,45 128,45 100,45 C 72,45 56,45 56,85 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Hair under Cap -->
  <path d="M 54,78 C 54,92 56,102 65,98 C 65,88 67,82 72,82 C 78,82 79,88 88,85 C 93,83 98,86 104,85 C 112,85 118,82 128,82 C 133,82 135,88 135,98 C 144,102 146,92 146,78 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="2"/>

  <!-- Backwards Cap -->
  <!-- Cap Crown Dome -->
  <path d="M 54,76 C 52,25 148,25 146,76 C 146,78 54,78 54,76 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>
  
  <!-- Backwards Cap Opening & Strap -->
  <path d="M 82,64 C 82,46 118,46 118,64 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="4"/>
  <!-- Plastic Strap -->
  <path d="M 83,57 L 117,57" stroke="#ffffff" stroke-width="8" stroke-linecap="square"/>
  <circle cx="90" cy="57" r="1.5" fill="#1e1b18"/>
  <circle cx="96" cy="57" r="1.5" fill="#1e1b18"/>
  <circle cx="104" cy="57" r="1.5" fill="#1e1b18"/>
  <circle cx="110" cy="57" r="1.5" fill="#1e1b18"/>
  <path d="M 82,57 L 118,57" fill="none" stroke="#1e1b18" stroke-width="2.5"/>

  <!-- Cap Visor (Pointing backwards/turned) -->
  <path d="M 52,75 C 48,72 152,72 148,75" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 68,85 Q 80,82 89,86" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>
  <path d="M 111,86 Q 120,82 132,85" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="79" cy="97" rx="5" ry="6" fill="#1e1b18"/>
  <ellipse cx="121" cy="97" rx="5" ry="6" fill="#1e1b18"/>

  <!-- Nose -->
  <ellipse cx="100" cy="113" rx="1.5" ry="2" fill="#1e1b18"/>

  <!-- Mouth -->
  <path d="M 94,124 L 106,124" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
</svg>
