<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#d96c60"/>

  <!-- Solid Black T-Shirt Clothes -->
  <path d="M 50,200 L 60,165 L 78,148 L 122,148 L 140,165 L 150,200 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- T-shirt collar line -->
  <path d="M 78,148 C 78,165 122,165 122,148" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Neck -->
  <path d="M 82,118 L 82,150 C 92,155 108,155 118,150 L 118,118 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ears -->
  <path d="M 58,90 C 46,90 46,115 58,115" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 54,98 C 52,102 55,106 58,105" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <path d="M 142,90 C 154,90 154,115 142,115" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 146,98 C 148,102 145,106 142,105" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <!-- Face Contour -->
  <path d="M 58,88 C 58,130 74,144 100,144 C 126,144 142,130 142,88 C 142,45 126,45 100,45 C 74,45 58,45 58,88 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Voluminous Fluffy Wavy Dark Hair -->
  <path d="M 52,88 C 42,70 44,45 62,32 C 78,20 122,20 138,32 C 156,45 158,70 148,88 C 146,78 138,68 126,64 C 114,60 108,68 96,65 C 84,62 76,60 64,65 C 58,68 55,76 52,88 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="2"/>
  
  <!-- Wave / curl strands on top -->
  <path d="M 74,42 C 84,35 94,37 98,46" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 108,38 C 118,35 128,40 130,48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 86,58 C 96,52 106,54 114,60" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>

  <!-- Eyebrows -->
  <path d="M 68,85 Q 80,82 89,86" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>
  <path d="M 111,86 Q 120,82 132,85" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="79" cy="97" rx="5" ry="6" fill="#1e1b18"/>
  <ellipse cx="121" cy="97" rx="5" ry="6" fill="#1e1b18"/>

  <!-- Nose -->
  <ellipse cx="100" cy="113" rx="1.5" ry="2" fill="#1e1b18"/>

  <!-- Mouth -->
  <path d="M 94,124 L 106,124" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
</svg>
