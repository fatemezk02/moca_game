<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#d96c60"/>

  <!-- Back Hair -->
  <path d="M 46,95 C 40,115 42,138 60,146 C 70,150 82,152 100,152 C 118,152 130,150 140,146 C 158,138 160,115 154,95 C 158,55 145,28 100,28 C 55,28 42,55 46,95 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Blazer & Clothes -->
  <path d="M 50,200 L 60,165 L 82,148 L 118,148 L 140,165 L 150,200 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Black Inner Top -->
  <path d="M 80,148 L 84,192 C 94,195 106,195 116,192 L 120,148 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="4"/>
  <!-- Lapels -->
  <path d="M 82,148 L 62,175 L 84,185 L 82,200" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 118,148 L 138,175 L 116,185 L 118,200" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Neck -->
  <path d="M 82,118 L 82,150 C 92,155 108,155 118,150 L 118,118 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ears & Pearl Earrings -->
  <path d="M 58,92 C 48,92 48,114 58,114" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="58" cy="113" r="3.5" fill="#ffffff" stroke="#1e1b18" stroke-width="2.5"/>

  <path d="M 142,92 C 152,92 152,114 142,114" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="142" cy="113" r="3.5" fill="#ffffff" stroke="#1e1b18" stroke-width="2.5"/>

  <!-- Face Contour -->
  <path d="M 58,90 C 58,130 74,144 100,144 C 126,144 142,130 142,90" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Front Bob Bangs & Hair volume -->
  <path d="M 46,90 C 44,52 60,30 100,30 C 140,30 156,52 154,90 C 154,102 148,114 144,118 C 144,95 138,82 130,80 C 118,78 114,84 102,80 C 92,76 88,84 76,82 C 68,80 62,94 56,118 C 52,114 46,102 46,90 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="2"/>

  <!-- Bang strand details -->
  <path d="M 94,48 C 104,65 116,84 106,85" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 86,45 C 92,60 98,75 92,78" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 70,88 Q 80,84 88,88" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 112,88 Q 120,84 130,88" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Eyes with delicate eyelashes -->
  <ellipse cx="79" cy="98" rx="5" ry="6" fill="#1e1b18"/>
  <ellipse cx="121" cy="98" rx="5" ry="6" fill="#1e1b18"/>

  <!-- Nose -->
  <ellipse cx="100" cy="113" rx="1.5" ry="2" fill="#1e1b18"/>

  <!-- Mouth -->
  <path d="M 94,124 L 106,124" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
</svg>
