<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#d96c60"/>

  <!-- Sweater Clothes -->
  <path d="M 50,200 L 60,165 L 78,148 L 122,148 L 140,165 L 150,200 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Striped Crewneck Collar -->
  <path d="M 78,148 C 78,168 122,168 122,148" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>
  <!-- Collar texture stripes -->
  <path d="M 85,152 L 85,160" stroke="#1e1b18" stroke-width="2" stroke-linecap="round"/>
  <path d="M 91,154 L 91,163" stroke="#1e1b18" stroke-width="2" stroke-linecap="round"/>
  <path d="M 97,155 L 97,164" stroke="#1e1b18" stroke-width="2" stroke-linecap="round"/>
  <path d="M 103,155 L 103,164" stroke="#1e1b18" stroke-width="2" stroke-linecap="round"/>
  <path d="M 109,154 L 109,163" stroke="#1e1b18" stroke-width="2" stroke-linecap="round"/>
  <path d="M 115,152 L 115,160" stroke="#1e1b18" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 82,118 L 82,150 C 92,155 108,155 118,150 L 118,118 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ears -->
  <path d="M 58,90 C 46,90 46,115 58,115" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 54,98 C 52,102 55,106 58,105" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <path d="M 142,90 C 154,90 154,115 142,115" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 146,98 C 148,102 145,106 142,105" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <!-- Face Contour -->
  <path d="M 58,88 C 58,130 74,144 100,144 C 126,144 142,130 142,88 C 142,45 126,45 100,45 C 74,45 58,45 58,88 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Neat Parted Hair -->
  <path d="M 54,88 C 48,46 64,30 100,30 C 136,30 152,46 146,88 C 144,78 136,68 126,66 C 114,64 108,72 96,70 C 86,68 76,64 64,68 C 58,70 55,78 54,88 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="2"/>
  <path d="M 74,44 C 84,38 95,38 102,44" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M 112,42 C 122,38 132,42 138,48" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- Eyebrows (above glasses) -->
  <path d="M 68,78 Q 80,74 90,78" fill="none" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 110,78 Q 120,74 132,78" fill="none" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Glasses Frames -->
  <!-- Left Lens -->
  <rect x="65" y="86" width="28" height="24" rx="9" fill="#ffffff" stroke="#1e1b18" stroke-width="4"/>
  <!-- Right Lens -->
  <rect x="107" y="86" width="28" height="24" rx="9" fill="#ffffff" stroke="#1e1b18" stroke-width="4"/>
  <!-- Glasses Bridge -->
  <path d="M 93,96 C 96,93 104,93 107,96" fill="none" stroke="#1e1b18" stroke-width="4" stroke-linecap="round"/>
  <!-- Glasses Temples (to ears) -->
  <path d="M 65,96 L 56,95" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 135,96 L 144,95" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="79" cy="98" rx="4.5" ry="5.5" fill="#1e1b18"/>
  <ellipse cx="121" cy="98" rx="4.5" ry="5.5" fill="#1e1b18"/>

  <!-- Nose -->
  <ellipse cx="100" cy="116" rx="1.5" ry="2" fill="#1e1b18"/>

  <!-- Mouth -->
  <path d="M 94,126 L 106,126" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
</svg>
