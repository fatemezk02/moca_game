<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Background -->
  <rect width="200" height="200" fill="#dbe896"/>

  <!-- High Topknot Bun on top -->
  <ellipse cx="100" cy="30" rx="22" ry="20" fill="#1e1b18" stroke="#1e1b18" stroke-width="4.5"/>
  <!-- Hair scrunchie / band -->
  <path d="M 86,44 C 92,41 108,41 114,44 C 114,48 86,48 86,44 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bun texture line -->
  <path d="M 90,26 C 94,18 106,18 110,26" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Hoodie Clothes -->
  <path d="M 50,200 L 58,168 L 76,150 L 124,150 L 142,168 L 150,200 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- Hoodie Collar opening -->
  <path d="M 76,150 C 76,180 124,180 124,150" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>
  <!-- Hoodie strings -->
  <path d="M 88,168 L 88,198" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="88" cy="198" r="2.5" fill="#1e1b18"/>
  <path d="M 112,168 L 112,198" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="112" cy="198" r="2.5" fill="#1e1b18"/>

  <!-- Neck -->
  <path d="M 82,118 L 82,150 C 92,155 108,155 118,150 L 118,118 Z" fill="#ffffff" stroke="#1e1b18" stroke-width="4" stroke-linejoin="round"/>

  <!-- Ears -->
  <path d="M 58,92 C 48,92 48,114 58,114" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 54,100 C 52,103 55,106 58,105" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <path d="M 142,92 C 152,92 152,114 142,114" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 146,100 C 148,103 145,106 142,105" fill="none" stroke="#1e1b18" stroke-width="3" stroke-linecap="round"/>

  <!-- Wisps of hair in front of ears -->
  <path d="M 56,92 Q 48,110 50,126" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 144,92 Q 152,110 150,126" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Face Contour -->
  <path d="M 58,90 C 58,130 74,144 100,144 C 126,144 142,130 142,90" fill="#ffffff" stroke="#1e1b18" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Updo Hair & Bangs -->
  <path d="M 52,90 C 48,52 64,44 100,44 C 136,44 152,52 148,90 C 146,82 140,75 132,74 C 122,72 116,80 102,78 C 94,76 86,72 74,74 C 64,75 58,82 52,90 Z" fill="#1e1b18" stroke="#1e1b18" stroke-width="2"/>
  <path d="M 88,52 C 94,65 98,75 92,84" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyebrows -->
  <path d="M 70,88 Q 80,84 88,88" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 112,88 Q 120,84 130,88" fill="none" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="79" cy="98" rx="5" ry="6" fill="#1e1b18"/>
  <ellipse cx="121" cy="98" rx="5" ry="6" fill="#1e1b18"/>

  <!-- Nose -->
  <ellipse cx="100" cy="113" rx="1.5" ry="2" fill="#1e1b18"/>

  <!-- Mouth -->
  <path d="M 94,124 L 106,124" stroke="#1e1b18" stroke-width="3.5" stroke-linecap="round"/>
</svg>
