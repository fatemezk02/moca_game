<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#fbf9f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>آرشیو ۰۱ — نقشه تعاملی گالری ۰۰</title>
    <meta name="description" content="نقشه تعاملی و راهنمای آثار موزه و بخش‌های گالری همراه با آزمون و پرسش‌های گالری ۰۱ و ۰۳" />
    
    <!-- Google Fonts: Vazirmatn, Hanken Grotesk & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#fbf9f9] text-[#0e0f0f] antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script>
      // Global debug baseline so window.getGameContentStats and window.__GAME_CONTENT_DEBUG__ exist on window from the start
      window.__GAME_CONTENT_DEBUG__ = window.__GAME_CONTENT_DEBUG__ || {
        getSummary: function() {
          return {
            isLoaded: false,
            source: 'none',
            lastLoadedDate: null,
            counts: { questions: 0, stars: 0, artworks: 0 },
            hasLocalCache: false
          };
        },
        getQuestions: function() { return []; },
        getStars: function() { return []; },
        getArtworks: function() { return []; },
        refresh: function() { return Promise.resolve(null); },
        clearCache: function() {}
      };
      window.getGameContentStats = function() {
        return window.__GAME_CONTENT_DEBUG__.getSummary();
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
